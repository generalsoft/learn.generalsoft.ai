name: Deploy learn.generalsoft.ai

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install

      - name: Run Frontend Tests
        run: npm run test

      - name: Install Backend Dependencies
        run: |
          cd functions
          npm install

      - name: Run Backend Tests
        run: |
          cd functions
          npm run test

      - name: Build Static Site
        run: npm run build
        env:
          VITE_API_BASE_URL: "" # Pointing to relative path /api (if API shares domain via proxy/routing) or replace with API Gateway URL
          VITE_ANALYTICS_ID: ""

      - name: Deploy static folder to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
